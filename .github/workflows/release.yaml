name: cd/release

on:
  push:
    branches:
      - main

jobs:
  build-check:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: setup-dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0
          cache: true

      - name: setup-nuget
        run: dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --name github "https://nuget.pkg.github.com/HunterPie/index.json"

      - name: restore
        run: dotnet restore Arisen.slnx --use-lock-file

      - name: build
        run: dotnet build Arisen.slnx --no-restore --no-logo -v q --property WarningLevel=0 /clp:ErrorsOnly --output ./bin
      
      - id: deploy-plugin
        name: deploy-plugin
        uses: HunterPie/deploy-plugin@v1.0.1
        with:
          entrypoint: Arisen
          plugin-path: ./bin
      
      - name: create-github-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.deploy-plugin.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.deploy-plugin.outputs.artifact }}